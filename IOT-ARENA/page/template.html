<!DOCTYPE html>
<html lang="th" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details - IOT-ARENA</title>
    <script>
        (function() {
            // Theme Management
            const theme = localStorage.getItem('theme') || 'auto';
            let visualTheme = theme;
            if (theme === 'auto') {
                visualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-bs-theme', visualTheme);

            // Language (to avoid button flash)
            const savedLang = localStorage.getItem('lang');
            let lang = savedLang;
            if (!lang) {
                const browserLang = navigator.language || navigator.userLanguage;
                lang = (browserLang && browserLang.toLowerCase().startsWith('th')) ? 'th' : 'en';
            }
            document.documentElement.setAttribute('data-lang', lang);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
